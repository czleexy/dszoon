# 锐捷：enable 提权（弹密码提示）+ 命令风格为 show/terminal。
- name: ruijie-rgos11-enable
  hostname: RJ-ACCESS-03
  vendor: ruijie
  username: admin
  password: admin123
  prompts:
    user: '{hostname}>'
    privileged: '{hostname}#'
  banner: |
    Ruijie Networks
    RGOS 11.4(1)B70P2
  paging:
    enabled: true
    page_lines: 12
    token: "---- More ----"
    style: own_line
  rules:
    - pattern: '^enable$'
      output: 'Password: '
      prompt: false
    - pattern: '^RGenable123$'      # enable 密码，设备不回显
      echo: false
      output: ''
      set: {mode: privileged}
    - pattern: '^terminal length 0$'
      output: ''
      set: {paging_enabled: false}
    - pattern: '^terminal width 512$'
      output: ''
    - pattern: '^show version$'
      output_file: ruijie/rgos11/show_version.txt
    - pattern: '^show running-config$'
      output_file: ruijie/rgos11/show_running-config.txt
    - pattern: '^show startup-config$'
      output: ''

# 锐捷：设备没设 enable 密码 —— enable 直接成功、不弹密码提示。
# 采集器必须识别这种情况并跳过密码步骤，而不是把密码当命令发出去。
- name: ruijie-rgos11-no-enable-password
  hostname: RJ-EDGE-09
  vendor: ruijie
  username: admin
  password: admin123
  prompts:
    user: '{hostname}>'
    privileged: '{hostname}#'
  paging:
    enabled: false
  rules:
    - pattern: '^enable$'
      output: ''
      set: {mode: privileged}
    - pattern: '^terminal length 0$'
      output: ''
    - pattern: '^terminal width 512$'
      output: ''
    - pattern: '^show version$'
      output_file: ruijie/rgos11/show_version.txt
    - pattern: '^show running-config$'
      output_file: ruijie/rgos11/show_running-config.txt
    - pattern: '^show startup-config$'
      output: ''

