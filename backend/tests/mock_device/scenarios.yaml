# 设备返回了内容，但内容是残的（没有 return 结尾）——必须判为 integrity_error，
# 绝不能静默当成"备份成功"。
- name: huawei-truncated
  hostname: HW-TRUNC
  vendor: huawei
  username: admin
  password: admin123
  paging:
    enabled: false
  rules:
    - pattern: '^screen-length 0 temporary$'
      output: ''
    - pattern: '^screen-width 512$'
      output: ''
    - pattern: '^display version$'
      output_file: huawei/vrp8/display_version.txt
    - pattern: '^display current-configuration$'
      output_file: huawei/vrp8/display_current-configuration_truncated.txt
