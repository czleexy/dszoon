# Mock 设备剧本。
#
# 每个剧本模拟一类"真机上很难稳定复现、但一定会遇到"的行为：
# 分页、ANSI 噪声、GBK 编码、认证失败、命令被拒绝、会话中途断连、设备卡死、内容截断。
#
# 约定：
#   pattern       匹配设备收到的整行命令（已 strip），首个匹配生效
#   output        直接回显的文本；output_file 指向 tests/fixtures 下的文件
#   prompt        false 表示这条命令的输出后不打印提示符（如 Password:）
#   set           修改设备内部状态（paging_enabled / mode / encoding / ...）
#   behavior      hang=不再吐任何数据；close_mid_output=输出一半就断连
#   echo         单条命令是否回显（密码类命令必须关掉）
#
# 未匹配到任何规则的命令一律回 default_output，用于验证"预处理命令被拒绝"的分支。

- name: huawei-vrp8
  hostname: HW-CORE-01
  vendor: huawei
  username: admin
  password: admin123
  banner: |
    Info: The max number of VTY users is 10, and the number
          of current VTY users on line is 1.
  paging:
    enabled: true
    page_lines: 12
    token: "  ---- More ----"
    style: own_line
  rules:
    - pattern: '^screen-length 0 temporary$'
      output: ''
      set: {paging_enabled: false}
    - pattern: '^screen-width 512$'
      output: ''
    - pattern: '^display version$'
      output_file: huawei/vrp8/display_version.txt
    - pattern: '^display current-configuration$'
      output_file: huawei/vrp8/display_current-configuration.txt
    - pattern: '^display saved-configuration$'
      output_file: huawei/vrp8/display_saved-configuration.txt

# ★ 真机回放：VRP5（S5720S）实测行为。
#   `screen-width 512` 会弹 "This command will change the default screen width.
#   Continue? [Y/N]:"，不回答就一直干等——空闲探活发的是空格，设备只认 Y/N，
#   最终报"会话空闲 N 秒无数据"，完全指不到真正原因（实测白等 65 秒）。
- name: huawei-vrp5-screen-width-confirm
  hostname: HW-S5720-01
  vendor: huawei
  username: admin
  password: admin123
  paging:
    enabled: true
    page_lines: 10
  rules:
    - pattern: '^screen-length 0 temporary$'
      output: ''
      set: {paging_enabled: false}
    - pattern: '^screen-width 512$'
      output: 'Warning: This command will change the default screen width. Continue? [Y/N]:'
      prompt: false
    - pattern: '^[Yy]$'
      output: ''
      set: {term_width: 512}
    - pattern: '^display version$'
      output_file: huawei/vrp5/display_version.txt
    - pattern: '^display current-configuration$'
      output_file: huawei/vrp5/display_current-configuration.txt
    - pattern: '^display saved-configuration$'
      output: ''

# 老设备：关分页/关折行命令都被拒绝 —— 采集器必须靠"响应分页提示符"把配置取全，
# 同时把"预处理命令失败"作为警告暴露出来，而不是假装一切正常。
- name: huawei-vrp8-paging-stuck
  hostname: HW-OLD-01
  vendor: huawei
  username: admin
  password: admin123
  banner: |
    Info: The max number of VTY users is 10.
  paging:
    enabled: true
    page_lines: 10
    token: "  ---- More ----"
    style: own_line
  rules:
    - pattern: '^screen-length 0 temporary$'
      output: "% Unrecognized command found at '^' position."
    - pattern: '^screen-width 512$'
      output: "% Unrecognized command found at '^' position."
    - pattern: '^display version$'
      output_file: huawei/vrp8/display_version.txt
    - pattern: '^display current-configuration$'
      output_file: huawei/vrp8/display_current-configuration.txt
    - pattern: '^display saved-configuration$'
      output: ''

