# dszoon 反向代理配置
#
# 两个关键点（少一个就会出诡异问题）：
#   1. SSE（任务实时进度）必须关掉缓冲，否则前端要等任务结束才一次收到全部事件；
#   2. 采集大配置可能几十秒，读超时要放大。

upstream dszoon_app {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 自签证书存在时启用 HTTPS（deploy/certs/ 下放 fullchain.pem + privkey.pem）
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss;
    gzip_min_length 1024;

    location / {
        proxy_pass http://dszoon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # SSE：必须单独配，且不能缓冲
    location ~ ^/api/v1/backups/[0-9]+/stream$ {
        proxy_pass http://dszoon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 这两行才是关键：不关缓冲的话，前端要等任务结束才能一次性收到全部事件
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }
}
