# Alembic configuration.
#
# IMPORTANT: THIS FILE MUST STAY PURE ASCII.
# No Chinese comments, no smart quotes, no decorative symbols.
# Reason: alembic reads it through alembic.util.compat.read_config_parser, which
# hardcodes encoding="locale". On a zh-CN Windows box that is GBK/cp936, so a single
# non-ASCII byte makes "alembic upgrade head" / "revision" / "current" fail with
# UnicodeDecodeError: 'gbk' codec can't decode byte 0xa0 -- and the traceback gives no
# hint that a comment caused it. logging.fileConfig reads the same file with the same
# locale encoding, so the log configuration breaks as well.
# Guarded by tests/unit/test_migrations.py::test_alembic_ini_is_ascii_only, which was
# added after the first real run failed on exactly this (and which immediately caught a
# second violation while "fixing" the first one).
#
# The database URL is deliberately NOT configured here: migrations/env.py reads
# DSZOON_DATABASE_URL from app.core.config, so "alembic migrates database A while the
# app talks to database B" cannot happen.
#
# Typical commands (run from backend/):
#   alembic revision --autogenerate -m "init"   generate a revision (model vs database)
#   alembic upgrade head                        apply migrations
#   alembic downgrade -1                        roll back one step
#   alembic current / alembic history           inspect state
#
# NOTE: do not mix create_all (app/main.py on startup) with Alembic on the same
# database. Development uses create_all for speed; production uses Alembic only,
# otherwise the schema silently drifts.

[alembic]
# Run alembic from backend/. A relative path is used on purpose: it avoids both the
# %(here)s interpolation and the differences between alembic versions handling it.
script_location = migrations
prepend_sys_path = .
# Newer alembic uses this to decide the multi-path separator; setting it avoids a
# compatibility warning at startup.
version_path_separator = os
# NOTE: every % here must be written as %% -- configparser collapses %% back to % first,
# and a single % such as %(year)d is treated as interpolation, raising
# InterpolationMissingOptionError whose message never mentions templates.
# (Contrast: %(here)s IS configparser interpolation and must stay a single %.
#  Using a relative path above is what keeps these two rules from getting mixed up.)
# Timestamped revision filenames make them sortable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
